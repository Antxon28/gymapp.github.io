<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark only">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="supported-color-schemes" content="dark">
<title>Gym Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121212'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f2c230' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f2c230'/%3E%3C/svg%3E">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Paleta: base #121212 + colores de los discos olímpicos (amarillo = 15 kg, rojo = 25 kg)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#121212',
          surface: '#1b1b1d',
          raised: '#262629',
          line: '#303035',
          chalk: '#ececee',
          mute: '#9d9da6',
          plate: '#f2c230',
          danger: '#ff6369'
        }
      }
    }
  };
</script>
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  html { background: #121212; -webkit-text-size-adjust: 100%; }
  body {
    background: #121212; color: #ececee;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid #f2c230; outline-offset: 2px; }
  input:focus-visible { outline: none; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  input::placeholder { color: #5d5d64; }
  .press { transition: transform .08s ease; }
  .press:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body class="bg-ink text-chalk antialiased">

<div class="mx-auto w-full max-w-xl min-h-screen flex flex-col">
  <header id="header" class="sticky top-0 z-20 bg-ink/95 backdrop-blur px-4 pb-3" style="padding-top: calc(var(--safe-top) + 12px)"></header>
  <main id="view" class="flex-1 px-4" style="padding-bottom: calc(var(--safe-bottom) + 112px)"></main>
</div>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-ink border-t border-line" style="padding-bottom: var(--safe-bottom)" aria-label="Navegación principal">
  <div id="tabs" class="mx-auto max-w-xl grid grid-cols-4"></div>
</nav>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite" style="display:none"></div>

<script>
(() => {
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const KEY = 'gymlog.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = v => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, 60);
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const parseNum = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };
const validDate = v => { const d = new Date(v); return isNaN(d) ? new Date().toISOString() : d.toISOString(); };
const fmt = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const fmtSet = s => s.kg > 0 ? `${s.reps} × ${fmt(s.kg)} kg` : `${s.reps} reps`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtDate = iso => {
  const d = new Date(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', ...(sameYear ? {} : { year: 'numeric' }) });
};
const fmtLong = iso => new Date(iso).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysSince = iso => {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(iso); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 864e5);
};

/* =========================================================
   Iconos (SVG en línea)
   ========================================================= */
const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  chart: '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  upload: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  more: '<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const icon = (name, cls = 'w-6 h-6') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* =========================================================
   Estado y persistencia (localStorage)
   ========================================================= */
const emptyState = () => ({ version: 1, routines: [], workouts: [], draft: null, meta: { lastExport: null } });

// Valida y limpia rutinas + entrenos (sirve para cargar y para importar)
function normalize(src) {
  const data = src && src.data ? src.data : src;
  if (!data || !Array.isArray(data.routines) || !Array.isArray(data.workouts)) throw new Error('Formato no válido');
  const routines = data.routines.map(r => ({
    id: String(r.id || uid()),
    name: clean(r.name) || 'Rutina',
    exercises: (Array.isArray(r.exercises) ? r.exercises : [])
      .map(x => ({ id: String(x.id || uid()), name: clean(x.name) }))
      .filter(x => x.name)
  }));
  const workouts = data.workouts.map(w => ({
    id: String(w.id || uid()),
    date: validDate(w.date),
    routineId: w.routineId ? String(w.routineId) : null,
    routineName: clean(w.routineName) || 'Entreno',
    entries: (Array.isArray(w.entries) ? w.entries : []).map(e => ({
      exerciseName: clean(e.exerciseName),
      sets: (Array.isArray(e.sets) ? e.sets : []).map(t => ({ reps: Math.round(parseNum(t.reps)), kg: parseNum(t.kg) }))
    })).filter(e => e.exerciseName && e.sets.length)
  })).filter(w => w.entries.length);
  return { routines, workouts };
}

const clampSec = v => Math.min(1800, Math.max(5, Math.round(Number(v)) || 90));
function sanitizeDraft(d) {
  if (!d || !Array.isArray(d.entries)) return null;
  const entries = d.entries.map(e => ({
    exerciseName: clean(e.exerciseName),
    gif: String(e.gif ?? '').slice(0, 500),
    notes: String(e.notes ?? '').slice(0, 500).trim(),
    completed: Boolean(e.completed),
    timerSec: clampSec(e.timerSec),
    sets: (Array.isArray(e.sets) ? e.sets : []).map(s => ({ reps: String(s.reps ?? ''), kg: String(s.kg ?? '') }))
  })).filter(e => e.exerciseName);
  if (!entries.length) return null;
  return {
    id: String(d.id || uid()),
    routineId: d.routineId ? String(d.routineId) : null,
    routineName: clean(d.routineName) || 'Entreno',
    startedAt: validDate(d.startedAt),
    entries
  };
}

function load() {
  const s = emptyState();
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* almacenamiento bloqueado */ }
  if (!raw) return s;
  try {
    const p = JSON.parse(raw);
    const n = normalize(p);
    s.routines = n.routines;
    s.workouts = n.workouts;
    s.draft = sanitizeDraft(p.draft);
    s.meta.lastExport = p.meta && p.meta.lastExport ? validDate(p.meta.lastExport) : null;
  } catch (e) {
    // Datos ilegibles: se conserva una copia en bruto para no perderlos al guardar de nuevo
    try { localStorage.setItem(KEY + '.corrupto', raw); } catch (_) {}
    console.warn('Datos ilegibles; copia en bruto en ' + KEY + '.corrupto', e);
  }
  return s;
}

let state = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast('No se pudo guardar en este navegador. Exporta tus datos ya.', 'error'); }
  }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* =========================================================
   Estado de la interfaz (no se guarda)
   ========================================================= */
const ui = { tab: 'routines', routineId: null, workoutId: null, filter: '', expandedSessions: new Set(), expandedExercises: new Set(), trainMode: 'carousel', selectedExerciseIdx: null, panels: { notes: false, timer: false } };
const currentRoutine = () => {
  const r = state.routines.find(x => x.id === ui.routineId);
  if (!r) ui.routineId = null;
  return r || null;
};
const currentWorkout = () => {
  const w = state.workouts.find(x => x.id === ui.workoutId);
  if (!w) ui.workoutId = null;
  return w || null;
};

/* =========================================================
   Histórico (se agrupa por nombre de ejercicio)
   ========================================================= */
function getSortedWorkouts() {
  return [...state.workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
}

function lastSets(name) {
  const k = norm(name);
  let best = null;
  for (const w of state.workouts) {
    if (best && new Date(w.date) <= new Date(best.date)) continue;
    const e = w.entries.find(x => norm(x.exerciseName) === k);
    if (e) best = { date: w.date, sets: e.sets };
  }
  return best;
}

/* =========================================================
   Avisos y diálogos
   ========================================================= */
let toastTimer;
function toast(msg, kind = 'ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 -translate-x-1/2 z-[60] max-w-[90vw] text-center px-5 py-3 rounded-full font-semibold text-sm ${kind === 'error' ? 'bg-danger text-ink' : 'bg-chalk text-ink'}`;
  t.style.bottom = 'calc(var(--safe-bottom) + 84px)';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, kind === 'error' ? 4500 : 2400);
}

function sheet(inner, { input = false } = {}) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70';
    wrap.innerHTML = `<form role="dialog" aria-modal="true" class="w-full max-w-xl sm:max-w-md bg-surface border border-line rounded-t-3xl sm:rounded-3xl p-5" style="padding-bottom: calc(var(--safe-bottom) + 20px)">${inner}</form>`;
    const form = wrap.firstElementChild;
    const done = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', e => { if (e.target === wrap) done(null); });
    form.addEventListener('submit', e => { e.preventDefault(); done(input ? form.elements.namedItem('value').value : true); });
    form.querySelector('[data-cancel]').addEventListener('click', () => done(null));
    $('#modal-root').appendChild(wrap);
    const f = form.elements.namedItem('value');
    if (f) { f.focus(); f.select(); }
  });
}

const promptDialog = ({ title, value = '', placeholder = '', confirmLabel = 'Guardar' }) => sheet(`
  <h2 class="text-xl font-bold">${esc(title)}</h2>
  <input name="value" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"
    class="mt-4 w-full h-14 rounded-xl bg-raised border border-line px-4 text-lg outline-none focus:border-plate">
  <div class="mt-4 grid grid-cols-2 gap-3">
    <button type="button" data-cancel class="press h-14 rounded-xl bg-raised font-semibold">Cancelar</button>
    <button type="submit" class="press h-14 rounded-xl bg-plate text-ink font-bold">${esc(confirmLabel)}</button>
  </div>`, { input: true });

const confirmDialog = ({ title, text, confirmLabel = 'Confirmar', danger = false }) => sheet(`
  <h2 class="text-xl font-bold">${esc(title)}</h2>
  <p class="mt-2 text-mute">${esc(text)}</p>
  <div class="mt-5 grid grid-cols-2 gap-3">
    <button type="button" data-cancel class="press h-14 rounded-xl bg-raised font-semibold">Cancelar</button>
    <button type="submit" class="press h-14 rounded-xl ${danger ? 'bg-danger' : 'bg-plate'} text-ink font-bold">${esc(confirmLabel)}</button>
  </div>`);

/* =========================================================
   Componentes comunes
   ========================================================= */
const header = (title, { back = '', sub = '', right = '' } = {}) => `
  <div class="flex items-center gap-1 min-h-[52px]">
    ${back ? `<button data-action="${back}" class="press -ml-2 w-12 h-12 shrink-0 grid place-items-center rounded-full" aria-label="Volver">${icon('back')}</button>` : ''}
    <div class="min-w-0 flex-1">
      <h1 class="text-3xl font-extrabold tracking-tight truncate">${esc(title)}</h1>
      ${sub ? `<p class="text-sm text-mute -mt-0.5">${esc(sub)}</p>` : ''}
    </div>
    ${right}
  </div>`;

const emptyBlock = (title, text, extra = '') => `
  <div class="mt-12 text-center px-4">
    <div class="mx-auto w-16 h-16 rounded-full border-4 border-plate/50 grid place-items-center"><div class="w-3 h-3 rounded-full bg-plate/50"></div></div>
    <p class="mt-5 text-xl font-bold">${title}</p>
    <p class="mt-1 text-mute">${text}</p>
    ${extra}
  </div>`;

const TABS = [['routines', 'Rutinas', 'list'], ['train', 'Entrenar', 'dumbbell'], ['history', 'Histórico', 'chart'], ['settings', 'Ajustes', 'sliders']];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label, ic]) => `
    <button data-action="tab" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}
      class="press relative h-16 flex flex-col items-center justify-center gap-1 text-xs font-semibold ${ui.tab === id ? 'text-plate' : 'text-mute'}">
      ${icon(ic)}<span>${label}</span>
      ${id === 'train' && state.draft ? '<span class="absolute top-2 right-[calc(50%-22px)] w-2.5 h-2.5 rounded-full bg-plate"></span>' : ''}
    </button>`).join('');
}

/* =========================================================
   Pantalla 1: Rutinas
   ========================================================= */
function viewRoutines() {
  const cards = state.routines.map(r => {
    const names = r.exercises.map(x => x.name).join(', ');
    return `
    <article class="rounded-2xl bg-surface border border-line p-4">
      <h2 class="text-xl font-bold truncate">${esc(r.name)}</h2>
      <p class="mt-0.5 text-sm text-mute">${plural(r.exercises.length, 'ejercicio', 'ejercicios')}</p>
      ${names ? `<p class="mt-2 text-sm text-mute/80 line-clamp-2">${esc(names)}</p>` : ''}
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button data-action="routine-open" data-id="${esc(r.id)}" class="press h-14 rounded-xl bg-raised font-semibold">Editar</button>
        <button data-action="train-start" data-id="${esc(r.id)}" class="press h-14 rounded-xl border-2 border-plate text-plate font-bold">Entrenar</button>
      </div>
    </article>`;
  }).join('');

  return `
    <button data-action="routine-new" class="press w-full h-16 rounded-2xl bg-plate text-ink font-bold text-xl flex items-center justify-center gap-2">${icon('plus')} Nueva rutina</button>
    ${state.routines.length
      ? `<div class="mt-4 space-y-3">${cards}</div>`
      : emptyBlock('Todavía no tienes rutinas', 'Crea la primera, por ejemplo «Pecho y hombro», y añade sus ejercicios.')}`;
}

function viewRoutineDetail(r) {
  const rows = r.exercises.map(x => `
    <li class="flex items-center gap-1 rounded-xl bg-surface border border-line pl-4 pr-1 min-h-[3.5rem]">
      <span class="flex-1 min-w-0 text-lg font-semibold truncate">${esc(x.name)}</span>
      <button data-action="ex-gif" data-id="${esc(x.id)}" aria-label="Editar GIF de ${esc(x.name)}" class="press w-12 h-12 grid place-items-center rounded-full text-plate" title="GIF/video">${icon('edit', 'w-5 h-5')}</button>
      <button data-action="ex-rename" data-id="${esc(x.id)}" aria-label="Renombrar ${esc(x.name)}" class="press w-12 h-12 grid place-items-center rounded-full text-mute">${icon('edit', 'w-5 h-5')}</button>
      <button data-action="ex-del" data-id="${esc(x.id)}" aria-label="Quitar ${esc(x.name)}" class="press w-12 h-12 grid place-items-center rounded-full text-danger">${icon('trash', 'w-5 h-5')}</button>
    </li>`).join('');

  return `
    <form data-form="ex-add" class="flex gap-2" autocomplete="off">
      <input id="exName" name="exname" maxlength="60" placeholder="Nuevo ejercicio, ej. Press banca" enterkeyhint="done" autocapitalize="sentences"
        class="flex-1 min-w-0 h-14 rounded-xl bg-surface border border-line px-4 text-lg outline-none focus:border-plate">
      <button type="submit" class="press h-14 px-5 rounded-xl bg-plate text-ink font-bold">Añadir</button>
    </form>
    <ul class="mt-4 space-y-2">
      ${rows || '<li class="text-mute text-center py-8">Esta rutina aún no tiene ejercicios. Añade el primero arriba.</li>'}
    </ul>
    <button data-action="routine-delete" class="press mt-8 w-full h-14 rounded-xl border border-danger/50 text-danger font-semibold">Borrar rutina</button>`;
}

/* =========================================================
   Pantalla 2: Entrenamiento
   ========================================================= */
function viewTrain() {
  const d = state.draft;

  if (!d) {
    if (!state.routines.length) {
      return emptyBlock('Primero crea una rutina', 'En Rutinas añade una con sus ejercicios. Después podrás entrenarla desde aquí.',
        `<button data-action="tab" data-tab="routines" class="press mt-6 h-14 px-6 rounded-xl bg-plate text-ink font-bold">Ir a Rutinas</button>`);
    }
    return `
      <p class="text-mute mb-3">Elige la rutina de hoy.</p>
      <div class="space-y-3">
        ${state.routines.map(r => `
          <button data-action="train-start" data-id="${esc(r.id)}" class="press w-full min-h-[5rem] rounded-2xl bg-surface border border-line px-5 py-3 flex items-center justify-between gap-3 text-left">
            <span class="min-w-0">
              <span class="block text-xl font-bold truncate">${esc(r.name)}</span>
              <span class="block text-sm text-mute">${plural(r.exercises.length, 'ejercicio', 'ejercicios')}</span>
            </span>
            <span class="text-plate shrink-0">${icon('chevron')}</span>
          </button>`).join('')}
      </div>`;
  }

  // Mostrar todos los ejercicios en carrusel horizontal
  if (ui.trainMode === 'carousel') {
    if (!d.entries.length) {
      return emptyBlock('Sin ejercicios', 'La rutina no tiene ejercicios.');
    }

    const carouselId = 'exercise-carousel-' + d.id;

    return `
      <div class="mb-4">
        <div id="${carouselId}" class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide scroll-smooth gap-3 -mx-4 px-4 pb-2">
          ${d.entries.map((e, idx) => {
            return `
            <button data-action="exercise-select" data-i="${idx}" class="press flex-shrink-0 w-[80%] rounded-2xl bg-surface border-2 ${e.completed ? 'border-plate' : 'border-line'} overflow-hidden snap-center transition-colors hover:border-plate relative">
              <div class="aspect-video ${e.gif ? 'bg-black/30' : 'bg-raised'} overflow-hidden">
                ${e.gif ? `<img src="${esc(e.gif)}" alt="${esc(e.exerciseName)}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center"><p class="text-sm text-mute">Sin imagen</p></div>`}
                ${e.completed ? `<div class="absolute inset-0 flex items-center justify-center bg-black/40">
                  ${icon('check', 'w-12 h-12 text-plate')}
                </div>` : ''}
                ${timerBadgeFor(idx)}
              </div>
              <div class="p-3">
                <h3 class="font-bold text-base">${esc(e.exerciseName)}</h3>
              </div>
            </button>`;
          }).join('')}
        </div>
      </div>

      <button data-action="workout-save" class="press w-full h-14 rounded-2xl bg-plate text-ink font-bold">Guardar entreno</button>
      <button data-action="workout-discard" class="press mt-2 w-full h-10 rounded-xl text-danger font-semibold text-sm">Descartar</button>`;
  }

  // Vista detalle

function chart(pts) {
  const W = 320, H = 150, L = 38, R = 12, T = 14, B = 26;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const iw = W - L - R, ih = H - T - B;
  const X = i => L + i * iw / (pts.length - 1);
  const Y = v => T + ih * (1 - (v - lo) / (hi - lo));
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="#f2c230"/>`).join('');
  const sd = iso => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  const txt = 'fill="#9d9da6" font-size="11"';
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Evolución por sesión">
    <line x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke="#303035"/>
    <line x1="${L}" y1="${T + ih}" x2="${W - R}" y2="${T + ih}" stroke="#303035"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end" ${txt}>${fmt(hi)}</text>
    <text x="${L - 6}" y="${T + ih + 4}" text-anchor="end" ${txt}>${fmt(lo)}</text>
    <text x="${L}" y="${H - 6}" ${txt}>${sd(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" ${txt}>${sd(pts[pts.length - 1].d)}</text>
    <path d="${path}" fill="none" stroke="#f2c230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

/* =========================================================
   Temporizador individual por ejercicio (sin re-render por tick)
   ========================================================= */
const exTimer = { idx: null, remaining: 0, running: false, endAt: 0, interval: null };
const fmtClock = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
const timerRemainingFor = i => {
  const e = state.draft && state.draft.entries[i];
  if (!e) return 0;
  return exTimer.idx === i ? exTimer.remaining : e.timerSec;
};
const timerBtnLabel = i => exTimer.idx === i && exTimer.running ? 'Pausar' : (exTimer.idx === i && exTimer.remaining > 0 ? 'Reanudar' : 'Iniciar');
const timerBadgeFor = i => exTimer.idx === i && (exTimer.running || exTimer.remaining > 0)
  ? `<span data-timer-badge="${i}" class="num absolute top-2 right-2 px-3 py-1 rounded-full bg-black/70 text-plate font-bold text-sm">${fmtClock(exTimer.remaining)}</span>` : '';

function paintTimer() {
  document.querySelectorAll('[data-timer-display]').forEach(el => { el.textContent = fmtClock(timerRemainingFor(+el.dataset.timerDisplay)); });
  document.querySelectorAll('[data-timer-badge]').forEach(el => { el.textContent = fmtClock(timerRemainingFor(+el.dataset.timerBadge)); });
  document.querySelectorAll('[data-timer-btn]').forEach(el => { el.textContent = timerBtnLabel(+el.dataset.timerBtn); });
}
function stopTimerInterval() { if (exTimer.interval) { clearInterval(exTimer.interval); exTimer.interval = null; } }
function resetTimer() { stopTimerInterval(); exTimer.idx = null; exTimer.remaining = 0; exTimer.running = false; }
function tickTimer() {
  if (!exTimer.running) return;
  if (!state.draft) { resetTimer(); return; }
  exTimer.remaining = Math.max(0, Math.ceil((exTimer.endAt - Date.now()) / 1000));
  if (exTimer.remaining <= 0) {
    stopTimerInterval(); exTimer.running = false;
    playSound(); vibrate([250, 120, 250]);
    const e = state.draft.entries[exTimer.idx];
    toast(`Temporizador terminado${e ? ': ' + e.exerciseName : ''}`);
  }
  paintTimer();
}

function viewSettings() {
  const nR = state.routines.length, nW = state.workouts.length;
  const le = state.meta.lastExport;
  const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
  const lastTxt = le ? `Última copia: ${rtf.format(-daysSince(le), 'day')}.` : 'Todavía no has exportado ninguna copia.';
  const nudge = nW > 0 && (!le || daysSince(le) > 14);
  return `
    <section class="rounded-2xl bg-surface border border-line p-4">
      <h2 class="text-xl font-bold">Copia de seguridad</h2>
      <p class="mt-2 text-mute">Tus datos viven solo en este navegador. Exporta una copia para guardarla o para llevar tus rutinas y entrenos a otro móvil u otro navegador.</p>
      <p class="mt-3 font-semibold">${plural(nR, 'rutina', 'rutinas')} y ${plural(nW, 'entreno', 'entrenos')}</p>
      <p class="text-sm ${nudge ? 'text-plate' : 'text-mute'}">${lastTxt}${nudge ? ' Conviene exportar una.' : ''}</p>
      <div class="mt-4 space-y-3">
        <button data-action="export" class="press w-full h-16 rounded-2xl bg-plate text-ink font-bold text-xl flex items-center justify-center gap-2">${icon('download')} Exportar datos</button>
        <button data-action="import-pick" class="press w-full h-16 rounded-2xl bg-raised font-bold text-xl flex items-center justify-center gap-2">${icon('upload')} Importar datos</button>
        <input id="importFile" type="file" accept="application/json,.json" class="hidden">
      </div>
      <p class="mt-3 text-sm text-mute">Al importar, los datos del archivo reemplazan los actuales.</p>
    </section>`;
}

function exportData() {
  state.meta.lastExport = new Date().toISOString();
  save();
  const payload = {
    app: 'gym-log', version: 1, exportedAt: state.meta.lastExport,
    encoding: 'utf-8',
    data: { routines: state.routines, workouts: state.workouts }
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([new TextEncoder().encode(jsonStr)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-log-${ymd(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Datos exportados');
  render();
}

async function importFile(file) {
  let incoming;
  try {
    const text = await file.text();
    incoming = normalize(JSON.parse(text));
  } catch (e) {
    toast('El archivo no es una copia válida de Gym Log', 'error');
    console.error('Import error:', e);
    return;
  }
  const ok = await confirmDialog({
    title: '¿Importar estos datos?',
    text: `El archivo tiene ${plural(incoming.routines.length, 'rutina', 'rutinas')} y ${plural(incoming.workouts.length, 'entreno', 'entrenos')}. Reemplazarán ${plural(state.routines.length, 'rutina', 'rutinas')} y ${plural(state.workouts.length, 'entreno', 'entrenos')} que tienes ahora.`,
    confirmLabel: 'Reemplazar datos',
    danger: true
  });
  if (!ok) return;
  state.routines = incoming.routines;
  state.workouts = incoming.workouts;
  ui.routineId = null; ui.workoutId = null; ui.filter = '';
  save();
  render();
  toast('Datos importados');
}

/* =========================================================
   Render
   ========================================================= */
function renderHeader() {
  let h;
  if (ui.tab === 'routines') {
    const r = currentRoutine();
    h = r
      ? header(r.name, { back: 'routine-back', right: `<button data-action="routine-rename" class="press w-12 h-12 shrink-0 grid place-items-center rounded-full text-mute" aria-label="Renombrar rutina">${icon('edit')}</button>` })
      : header('Rutinas');
  } else if (ui.tab === 'train') {
    h = state.draft ? header(state.draft.routineName, { sub: fmtLong(state.draft.startedAt) }) : header('Entrenar');
  } else if (ui.tab === 'history') {
    h = header('Histórico');
  } else {
    h = header('Ajustes');
  }
  $('#header').innerHTML = h;
}

function viewHtml() {
  switch (ui.tab) {
    case 'routines': { const r = currentRoutine(); return r ? viewRoutineDetail(r) : viewRoutines(); }
    case 'train': return viewTrain();
    case 'history': return viewHistory();
    default: return viewSettings();
  }
}

function render() {
  renderHeader();
  $('#view').innerHTML = viewHtml();
  renderTabs();
  
  // Scroll al ejercicio seleccionado en el carrusel
  if (ui.tab === 'train' && ui.trainMode === 'carousel' && state.draft) {
    const idx = ui.selectedExerciseIdx !== null && ui.selectedExerciseIdx !== undefined ? ui.selectedExerciseIdx : 0;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const carousel = document.getElementById('exercise-carousel-' + state.draft.id);
        if (carousel && carousel.children[idx]) {
          carousel.children[idx].scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
        }
      });
    });
  }
}
function workoutText(w) {
  const out = [w.routineName, fmtDate(w.date), ''];
  w.entries.forEach(e => {
    out.push(e.exerciseName);
    e.sets.forEach((st, j) => out.push(`S${j + 1}: ${fmt(st.kg)} kg ${st.reps} reps`));
    if (e.notes) out.push(e.notes);
    out.push('');
  });
  return out.join('\n').trim();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
const nav = () => { render(); window.scrollTo(0, 0); };

/* =========================================================
   Acciones
   ========================================================= */
const actions = {
  tab: d => {
    ui.tab = d.tab; ui.routineId = null; ui.workoutId = null; ui.filter = ''; 
    if (d.tab !== 'train') ui.expandedExercises.clear();
    nav();
  },

  // --- Rutinas
  'routine-new': async () => {
    const name = clean(await promptDialog({ title: 'Nueva rutina', placeholder: 'Ej. Pecho y hombro', confirmLabel: 'Crear rutina' }));
    if (!name) return;
    const r = { id: uid(), name, exercises: [] };
    state.routines.push(r);
    save();
    ui.tab = 'routines'; ui.routineId = r.id;
    nav();
    toast('Rutina creada');
    setTimeout(() => { const i = $('#exName'); if (i) i.focus(); }, 0);
  },
  'routine-open': d => { ui.routineId = d.id; nav(); },
  'routine-back': () => { ui.routineId = null; nav(); },
  'routine-rename': async () => {
    const r = currentRoutine(); if (!r) return;
    const name = clean(await promptDialog({ title: 'Renombrar rutina', value: r.name, confirmLabel: 'Guardar' }));
    if (!name || name === r.name) return;
    r.name = name; save(); render(); toast('Nombre guardado');
  },
  'routine-delete': async () => {
    const r = currentRoutine(); if (!r) return;
    const ok = await confirmDialog({
      title: `¿Borrar «${r.name}»?`,
      text: 'Se elimina la rutina y su lista de ejercicios. Los entrenos ya guardados se conservan en el histórico.',
      confirmLabel: 'Borrar rutina', danger: true
    });
    if (!ok) return;
    state.routines = state.routines.filter(x => x.id !== r.id);
    save(); ui.routineId = null; nav(); toast('Rutina borrada');
  },
  'ex-gif': async d => {
    const r = currentRoutine(); if (!r) return;
    const x = r.exercises.find(e => e.id === d.id); if (!x) return;
    const gif = await promptDialog({ title: 'URL del GIF/video', value: x.gif || '', placeholder: 'https://ejemplo.com/gif.gif', confirmLabel: 'Guardar' });
    if (gif === null) return;
    x.gif = gif.slice(0, 500);
    save(); render(); toast('GIF actualizado');
  },
  'ex-rename': async d => {
    const r = currentRoutine(); if (!r) return;
    const x = r.exercises.find(e => e.id === d.id); if (!x) return;
    const name = clean(await promptDialog({ title: 'Renombrar ejercicio', value: x.name, confirmLabel: 'Guardar' }));
    if (!name || name === x.name) return;
    if (r.exercises.some(e => e !== x && norm(e.name) === norm(name))) { toast('Ese ejercicio ya está en la rutina', 'error'); return; }
    x.name = name; save(); render(); toast('Nombre guardado');
  },
  'ex-del': async d => {
    const r = currentRoutine(); if (!r) return;
    const x = r.exercises.find(e => e.id === d.id); if (!x) return;
    const ok = await confirmDialog({
      title: `¿Quitar «${x.name}»?`,
      text: 'Se quita de la rutina. Lo que ya hayas registrado con este ejercicio se conserva en el histórico.',
      confirmLabel: 'Quitar ejercicio', danger: true
    });
    if (!ok) return;
    r.exercises = r.exercises.filter(e => e !== x); save(); render();
  },

  // --- Entrenamiento
  'train-start': async d => {
    const r = state.routines.find(x => x.id === d.id); if (!r) return;
    if (!r.exercises.length) {
      toast('Añade ejercicios a la rutina antes de entrenar', 'error');
      ui.tab = 'routines'; ui.routineId = r.id; nav();
      return;
    }
    if (state.draft) {
      const ok = await confirmDialog({
        title: 'Ya tienes un entreno en curso',
        text: `Si empiezas «${r.name}» se descartará el entreno en curso de «${state.draft.routineName}».`,
        confirmLabel: 'Empezar nuevo', danger: true
      });
      if (!ok) return;
    }
    state.draft = {
      id: uid(), routineId: r.id, routineName: r.name, startedAt: new Date().toISOString(),
      entries: r.exercises.map(x => {
        const last = lastSets(x.name);
        const n = Math.min(Math.max(last ? last.sets.length : 1, 1), 8);
        return { exerciseName: x.name, gif: x.gif || '', notes: '', completed: false, timerSec: 90, sets: Array.from({ length: n }, () => ({ reps: '', kg: '' })) };
      })
    };
    resetTimer(); save(); ui.tab = 'train'; ui.routineId = null; ui.trainMode = 'carousel'; ui.selectedExerciseIdx = null; ui.expandedExercises.clear(); nav();
  },
  'exercise-select': d => {
    ui.selectedExerciseIdx = +d.i;
    ui.trainMode = 'detail';
    const ex = state.draft && state.draft.entries[ui.selectedExerciseIdx];
    ui.panels = { notes: !!(ex && ex.notes), timer: exTimer.idx === ui.selectedExerciseIdx };
    render();
  },
  'exercise-back': () => {
    ui.trainMode = 'carousel';
    render();
  },
  'set-add': d => {
    const e = state.draft && state.draft.entries[+d.i]; if (!e) return;
    const prev = e.sets[e.sets.length - 1];
    e.sets.push(prev ? { reps: prev.reps, kg: prev.kg } : { reps: '', kg: '' });
    save(); render();
  },
  'set-del': d => {
    const e = state.draft && state.draft.entries[+d.i]; if (!e) return;
    e.sets.splice(+d.j, 1); save(); render();
  },
  'ex-toggle': d => {
    const e = state.draft && state.draft.entries[+d.i];
    if (!e) return;
    e.completed = !e.completed;
    const exId = state.draft.id + '-ex-' + d.i;
    if (e.completed) {
      ui.expandedExercises.delete(exId);
    } else {
      ui.expandedExercises.add(exId);
    }
    save(); render();
  },
  'ex-expand': d => {
    const exId = state.draft.id + '-ex-' + d.i;
    if (ui.expandedExercises.has(exId)) {
      ui.expandedExercises.delete(exId);
    } else {
      ui.expandedExercises.add(exId);
    }
    render();
  },
  'workout-save': () => {
    const d = state.draft; if (!d) return;
    const entries = d.entries.map(e => ({
      exerciseName: e.exerciseName,
      notes: e.notes || '',
      sets: e.sets.map(s => ({ reps: Math.round(parseNum(s.reps)), kg: parseNum(s.kg) })).filter(s => s.reps > 0)
    })).filter(e => e.sets.length);
    if (!entries.length) { toast('Añade repeticiones en al menos una serie', 'error'); return; }
    state.workouts.push({ id: uid(), date: d.startedAt, routineId: d.routineId, routineName: d.routineName, entries });
    state.draft = null; resetTimer();
    save(); ui.tab = 'history'; ui.workoutId = null; ui.filter = ''; ui.expandedExercises.clear(); ui.trainMode = 'carousel'; ui.selectedExerciseIdx = null;
    nav(); toast('Entreno guardado');
  },
  'workout-discard': async () => {
    const ok = await confirmDialog({
      title: '¿Descartar el entreno?',
      text: 'Se pierden las series que has anotado en este entreno.',
      confirmLabel: 'Descartar entreno', danger: true
    });
    if (!ok) return;
    state.draft = null; resetTimer(); ui.trainMode = 'carousel'; ui.selectedExerciseIdx = null; save(); nav();
  },

  // --- Histórico
  'workout-copy': async d => {
    const w = state.workouts.find(x => x.id === d.id); if (!w) return;
    const ok = await copyText(workoutText(w));
    toast(ok ? 'Entreno copiado al portapapeles' : 'No se pudo copiar', ok ? 'ok' : 'error');
  },
  'workout-open': d => {
    if (ui.expandedSessions.has(d.id)) {
      ui.expandedSessions.delete(d.id);
    } else {
      ui.expandedSessions.add(d.id);
    }
    render();
  },
  'workout-delete': async d => {
    const w = state.workouts.find(x => x.id === d.id);
    if (!w) return;
    const ok = await confirmDialog({
      title: `¿Borrar el entreno de ${fmtDate(w.date)}?`,
      text: `Se elimina completamente el entreno «${w.routineName}» con todos sus ejercicios y notas.`,
      confirmLabel: 'Borrar entreno', danger: true
    });
    if (!ok) return;
    state.workouts = state.workouts.filter(x => x.id !== d.id);
    save(); render(); toast('Entreno borrado');
  },

  // --- Menú y temporizador por ejercicio
  'ex-menu': () => { const m = $('#exMenu'); if (m) m.classList.toggle('hidden'); },
  'ex-panel': d => { ui.panels[d.p] = !ui.panels[d.p]; render(); },
  'timer-toggle': d => {
    const i = +d.i, e = state.draft && state.draft.entries[i]; if (!e) return;
    unlockAudio();
    if (exTimer.idx === i && exTimer.running) {
      exTimer.remaining = Math.max(0, Math.ceil((exTimer.endAt - Date.now()) / 1000));
      stopTimerInterval(); exTimer.running = false;
    } else {
      if (exTimer.idx !== i || exTimer.remaining <= 0) { stopTimerInterval(); exTimer.idx = i; exTimer.remaining = e.timerSec; }
      exTimer.endAt = Date.now() + exTimer.remaining * 1000;
      exTimer.running = true;
      stopTimerInterval();
      exTimer.interval = setInterval(tickTimer, 250);
    }
    paintTimer();
  },
  'timer-reset': d => {
    if (exTimer.idx === +d.i) resetTimer();
    paintTimer();
  },
  'timer-adjust': d => {
    const i = +d.i, e = state.draft && state.draft.entries[i]; if (!e) return;
    if (exTimer.idx === i) resetTimer();
    e.timerSec = clampSec(e.timerSec + Number(d.d));
    save(); paintTimer();
  },

  // --- Ajustes
  export: exportData,
  'import-pick': () => { const f = $('#importFile'); if (f) f.click(); }
};

const forms = {
  'ex-add': f => {
    const r = currentRoutine(); if (!r) return;
    const name = clean(f.elements.namedItem('exname').value);
    if (!name) return;
    if (r.exercises.some(x => norm(x.name) === norm(name))) { toast('Ese ejercicio ya está en la rutina', 'error'); return; }
    r.exercises.push({ id: uid(), name });
    save(); render();
    const i = $('#exName'); if (i) i.focus();
  }
};

/* =========================================================
   Temporizador: sonido y vibración
   ========================================================= */
function vibrate(ms = 200) {
  try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
}

let audioCtx;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function playSound() {
  try {
    unlockAudio();
    const ctx = audioCtx;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.3);
  } catch (e) {}
}

/* =========================================================
   Eventos globales
   ========================================================= */
document.addEventListener('click', e => {
  const menu = $('#exMenu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('[data-menu]')) menu.classList.add('hidden');
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el);
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-field]') && state.draft) {
    if (el.dataset.field === 'notes') {
      const entry = state.draft.entries[+el.dataset.i];
      if (!entry) return;
      entry.notes = el.value.slice(0, 500);
      save();
    } else {
      const s = state.draft.entries[+el.dataset.i]?.sets[+el.dataset.j];
      if (!s) return;
      let v = el.value;
      v = el.dataset.field === 'reps' ? v.replace(/\D/g, '') : v.replace(/[^\d.,]/g, '');
      if (v !== el.value) el.value = v;
      s[el.dataset.field] = v;
      save();
    }
  } else if (el.id === 'histSearch') {
    ui.filter = el.value;
    render();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'importFile') {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importFile(f);
  }
});

/* =========================================================
   Arranque
   ========================================================= */
render();
})();
</script>
</body>
</html>
