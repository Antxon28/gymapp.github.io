<html lang="es">
<head>

<meta name="theme-color" content="#121212">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Gym Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121212'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f2c230' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f2c230'/%3E%3C/svg%3E">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Paleta: base #121212 + colores de los discos olímpicos (amarillo = 15 kg, rojo = 25 kg)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#121212',
          surface: '#1b1b1d',
          raised: '#262629',
          line: '#303035',
          chalk: '#ececee',
          mute: '#9d9da6',
          plate: '#f2c230',
          danger: '#ff6369'
        }
      }
    }
  };
</script>
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  html {
    background: #121212;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: text;
    -webkit-touch-callout: none;
    height: 100%;
    width: 100%;
  }
  body {
    background: #121212;
    color: #ececee;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior-y: none;
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-user-select: text;
  }
  * { box-sizing: border-box; }
  button, input, textarea, select {
    font: inherit;
    color: inherit;
    -webkit-appearance: none;
    -webkit-border-radius: 8px;
    font-size: 16px;
  }
  input[type="text"], input[type="email"], input[type="number"], textarea, select {
    padding: 8px 12px;
    border: 1px solid #303035;
    background: #121212;
    border-radius: 8px;
    min-height: 44px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #f2c230;
    box-shadow: 0 0 0 2px rgba(242, 194, 48, 0.1);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid #f2c230; outline-offset: 2px; }
  input:focus-visible { outline: none; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  input::placeholder { color: #5d5d64; }
  img, svg { max-width: 100%; height: auto; display: block; }
  main { max-width: 100%; width: 100%; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  @media (orientation: landscape) and (max-height: 500px) {
    #header { min-height: 56px; padding: 8px 16px; }
    nav { height: 48px; }
    nav button { height: 44px; font-size: 12px; }
    #view { padding-bottom: max(56px, calc(var(--safe-bottom) + 56px)) !important; }
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    body { padding-bottom: env(safe-area-inset-bottom); }
  }
  .press { transition: transform .08s ease; }
  .press:active { transform: scale(.97); }
  .carousel-pad::before, .carousel-pad::after { content: ''; flex: 0 0 calc((100% - var(--cw, 80%)) / 2 - 6px); }
  .card-w { width: var(--cw, 80%); }
  .train-fit #view { padding-bottom: var(--train-pad, 76px) !important; }
  .dragging, .dragging body { user-select: none; -webkit-user-select: none; }
  [data-ex] { -webkit-touch-callout: none; }
  @keyframes blockFlash { 0% { box-shadow: 0 0 0 3px #f2c230; } 100% { box-shadow: 0 0 0 3px rgba(242,194,48,0); } }
  .flash-block { animation: blockFlash 1.4s ease-out; }
  @keyframes focusUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .focus-anim { animation: focusUp .22s ease-out; }
  .sheet-open, .sheet-open body { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body class="bg-ink text-chalk antialiased">

<div class="mx-auto w-full min-h-screen flex flex-col" style="max-width:100%">
  <header id="header" class="sticky top-0 z-20 bg-ink/95 backdrop-blur px-4 pb-3" style="padding-top: calc(var(--safe-top) + 12px)"></header>
  <main id="view" class="flex-1 px-4" style="padding-bottom: calc(var(--safe-bottom) + 112px)"></main>
</div>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-ink border-t border-line" style="padding-bottom:var(--safe-bottom);width:100%;box-sizing:border-box" aria-label="Navegación principal">
  <div id="tabs" class="mx-auto max-w-xl grid grid-cols-4"></div>
</nav>

<div id="focusSheet" class="hidden" style="position:fixed;left:0;right:0;top:0;height:100%;z-index:45">
  <div data-action="sheet-close" class="absolute inset-0 bg-black/60" style="touch-action:none"></div>
  <div class="absolute inset-0 flex items-end justify-center pointer-events-none">
    <section id="focusPanel" role="dialog" aria-modal="true" aria-label="Detalle del ejercicio" class="pointer-events-auto w-full bg-surface border-t border-line rounded-t-3xl flex flex-col" style="height:90%;max-width:100%">
      <div id="focusGrab" class="shrink-0 py-3 grid place-items-center" style="touch-action:none"><span class="block w-12 h-1.5 rounded-full bg-line"></span></div>
      <div id="focusHead" class="shrink-0"></div>
      <div id="focusBody" class="min-h-0 flex-1 overflow-y-auto px-4 pt-1" style="overscroll-behavior:contain;padding-bottom:calc(var(--safe-bottom) + 16px)"></div>
    </section>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite" style="display:none"></div>

<script>
(() => {
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const KEY = 'gymlog.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = v => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, 60);
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const parseNum = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };
const validDate = v => { const d = new Date(v); return isNaN(d) ? new Date().toISOString() : d.toISOString(); };
const fmt = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const fmtSet = s => s.kg > 0 ? `${s.reps} × ${fmt(s.kg)} kg` : `${s.reps} reps`;
const elapsedSec = () => state.draft ? Math.max(0, Math.floor((Date.now() - new Date(state.draft.startedAt).getTime()) / 1000)) : 0;
const fmtElapsed = sec => {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const mm = String(m).padStart(2, '0'), s2 = String(ss).padStart(2, '0');
  return h ? `${h}:${mm}:${s2}` : `${mm}:${s2}`;
};
const fmtDuration = sec => {
  if (sec < 60) return '<1 min';
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? `${h} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`;
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtDate = iso => {
  const d = new Date(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', ...(sameYear ? {} : { year: 'numeric' }) });
};
const fmtLong = iso => new Date(iso).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysSince = iso => {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(iso); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 864e5);
};

/* =========================================================
   Iconos (SVG en línea)
   ========================================================= */
const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  chart: '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  upload: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  grip: '<circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>',
  more: '<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const icon = (name, cls = 'w-6 h-6') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* =========================================================
   Estado y persistencia (localStorage)
   ========================================================= */
const emptyState = () => ({ version: 1, routines: [], workouts: [], draft: null, meta: { lastExport: null } });

// Valida y limpia rutinas + entrenos (sirve para cargar y para importar)
function normalize(src) {
  const data = src && src.data ? src.data : src;
  if (!data || !Array.isArray(data.routines) || !Array.isArray(data.workouts)) throw new Error('Formato no válido');
  const routines = data.routines.map(r => ({
    id: String(r.id || uid()),
    name: clean(r.name) || 'Rutina',
    exercises: (Array.isArray(r.exercises) ? r.exercises : [])
      .map(x => ({ id: String(x.id || uid()), name: clean(x.name), gif: String(x.gif ?? '').slice(0, 500) }))
      .filter(x => x.name)
  }));
  const workouts = data.workouts.map(w => ({
    id: String(w.id || uid()),
    date: validDate(w.date),
    routineId: w.routineId ? String(w.routineId) : null,
    routineName: clean(w.routineName) || 'Entreno',
    durationSec: Math.max(0, Math.min(172800, Math.round(Number(w.durationSec)) || 0)),
    entries: (Array.isArray(w.entries) ? w.entries : []).map(e => ({
      exerciseName: clean(e.exerciseName),
      notes: String(e.notes ?? '').slice(0, 500).trim(),
      sets: (Array.isArray(e.sets) ? e.sets : []).map(t => ({ reps: Math.round(parseNum(t.reps)), kg: parseNum(t.kg) }))
    })).filter(e => e.exerciseName && (e.sets.length || e.notes))
  })).filter(w => w.entries.length);
  return { routines, workouts };
}

const clampSec = (v, def = 90) => Math.min(1800, Math.max(5, Math.round(Number(v)) || def));
function sanitizeDraft(d) {
  if (!d || !Array.isArray(d.entries)) return null;
  const entries = d.entries.map(e => ({
    exerciseName: clean(e.exerciseName),
    gif: String(e.gif ?? '').slice(0, 500),
    notes: String(e.notes ?? '').slice(0, 500).trim(),
    completed: Boolean(e.completed),
    workSec: clampSec(e.workSec, 40),
    restSec: clampSec(e.restSec ?? e.timerSec, 90),
    sets: (Array.isArray(e.sets) ? e.sets : []).map(s => ({ reps: String(s.reps ?? ''), kg: String(s.kg ?? '') }))
  })).filter(e => e.exerciseName);
  if (!entries.length) return null;
  return {
    id: String(d.id || uid()),
    routineId: d.routineId ? String(d.routineId) : null,
    routineName: clean(d.routineName) || 'Entreno',
    startedAt: validDate(d.startedAt),
    entries
  };
}

function load() {
  const s = emptyState();
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* almacenamiento bloqueado */ }
  if (!raw) return s;
  try {
    const p = JSON.parse(raw);
    const n = normalize(p);
    s.routines = n.routines;
    s.workouts = n.workouts;
    s.draft = sanitizeDraft(p.draft);
    s.meta.lastExport = p.meta && p.meta.lastExport ? validDate(p.meta.lastExport) : null;
  } catch (e) {
    // Datos ilegibles: se conserva una copia en bruto para no perderlos al guardar de nuevo
    try { localStorage.setItem(KEY + '.corrupto', raw); } catch (_) {}
    console.warn('Datos ilegibles; copia en bruto en ' + KEY + '.corrupto', e);
  }
  return s;
}

let state = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast('No se pudo guardar en este navegador. Exporta tus datos ya.', 'error'); }
  }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* =========================================================
   Estado de la interfaz (no se guarda)
   ========================================================= */
const ui = { tab: 'routines', routineId: null, workoutId: null, filter: '', expandedSessions: new Set(), expandedExercises: new Set(), selectedExerciseIdx: null, carouselIdx: 0, panels: { notes: false, timer: false } };
const currentRoutine = () => {
  const r = state.routines.find(x => x.id === ui.routineId);
  if (!r) ui.routineId = null;
  return r || null;
};
const currentWorkout = () => {
  const w = state.workouts.find(x => x.id === ui.workoutId);
  if (!w) ui.workoutId = null;
  return w || null;
};

/* =========================================================
   Histórico (se agrupa por nombre de ejercicio)
   ========================================================= */
function getSortedWorkouts() {
  return [...state.workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
}

function lastSets(name) {
  const k = norm(name);
  let best = null;
  for (const w of state.workouts) {
    if (best && new Date(w.date) <= new Date(best.date)) continue;
    const e = w.entries.find(x => norm(x.exerciseName) === k);
    if (e) best = { date: w.date, sets: e.sets };
  }
  return best;
}

/* =========================================================
   Avisos y diálogos
   ========================================================= */
let toastTimer;
function toast(msg, kind = 'ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 -translate-x-1/2 z-[60] max-w-[90vw] text-center px-5 py-3 rounded-full font-semibold text-sm ${kind === 'error' ? 'bg-danger text-ink' : 'bg-chalk text-ink'}`;
  t.style.bottom = 'calc(var(--safe-bottom) + 84px)';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, kind === 'error' ? 4500 : 2400);
}

function sheet(inner, { input = false } = {}) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70';
    wrap.innerHTML = `<form role="dialog" aria-modal="true" class="w-full max-w-xl sm:max-w-md bg-surface border border-line rounded-t-3xl sm:rounded-3xl p-5" style="padding-bottom: calc(var(--safe-bottom) + 20px)">${inner}</form>`;
    const form = wrap.firstElementChild;
    const done = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', e => { if (e.target === wrap) done(null); });
    form.addEventListener('submit', e => { e.preventDefault(); done(input ? form.elements.namedItem('value').value : true); });
    form.querySelector('[data-cancel]').addEventListener('click', () => done(null));
    $('#modal-root').appendChild(wrap);
    const f = form.elements.namedItem('value');
    if (f) { f.focus(); f.select(); }
  });
}

const promptDialog = ({ title, value = '', placeholder = '', confirmLabel = 'Guardar' }) => sheet(`
  <h2 class="text-xl font-bold">${esc(title)}</h2>
  <input name="value" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"
    class="mt-4 w-full h-14 rounded-xl bg-raised border border-line px-4 text-lg outline-none focus:border-plate">
  <div class="mt-4 grid grid-cols-2 gap-3">
    <button type="button" data-cancel class="press h-14 rounded-xl bg-raised font-semibold">Cancelar</button>
    <button type="submit" class="press h-14 rounded-xl bg-plate text-ink font-bold">${esc(confirmLabel)}</button>
  </div>`, { input: true });

const confirmDialog = ({ title, text, confirmLabel = 'Confirmar', danger = false }) => sheet(`
  <h2 class="text-xl font-bold">${esc(title)}</h2>
  <p class="mt-2 text-mute">${esc(text)}</p>
  <div class="mt-5 grid grid-cols-2 gap-3">
    <button type="button" data-cancel class="press h-14 rounded-xl bg-raised font-semibold">Cancelar</button>
    <button type="submit" class="press h-14 rounded-xl ${danger ? 'bg-danger' : 'bg-plate'} text-ink font-bold">${esc(confirmLabel)}</button>
  </div>`);

/* =========================================================
   Componentes comunes
   ========================================================= */
const header = (title, { back = '', sub = '', right = '' } = {}) => `
  <div class="flex items-center gap-1 min-h-[52px]">
    ${back ? `<button data-action="${back}" class="press -ml-2 w-12 h-12 shrink-0 grid place-items-center rounded-full" aria-label="Volver">${icon('back')}</button>` : ''}
    <div class="min-w-0 flex-1">
      <h1 class="text-3xl font-extrabold tracking-tight truncate">${esc(title)}</h1>
      ${sub ? `<p class="text-sm text-mute -mt-0.5">${esc(sub)}</p>` : ''}
    </div>
    ${right}
  </div>`;

const emptyBlock = (title, text, extra = '') => `
  <div class="mt-12 text-center px-4">
    <div class="mx-auto w-16 h-16 rounded-full border-4 border-plate/50 grid place-items-center"><div class="w-3 h-3 rounded-full bg-plate/50"></div></div>
    <p class="mt-5 text-xl font-bold">${title}</p>
    <p class="mt-1 text-mute">${text}</p>
    ${extra}
  </div>`;

const TABS = [['routines', 'Rutinas', 'list'], ['train', 'Entrenar', 'dumbbell'], ['history', 'Histórico', 'chart'], ['settings', 'Ajustes', 'sliders']];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label, ic]) => `
    <button data-action="tab" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}
      class="press relative h-16 flex flex-col items-center justify-center gap-1 text-xs font-semibold ${ui.tab === id ? 'text-plate' : 'text-mute'}">
      ${icon(ic)}<span>${label}</span>
      ${id === 'train' && state.draft ? '<span class="absolute top-2 right-[calc(50%-22px)] w-2.5 h-2.5 rounded-full bg-plate"></span>' : ''}
    </button>`).join('');
}

/* =========================================================
   Pantalla 1: Rutinas
   ========================================================= */
function viewRoutines() {
  const cards = state.routines.map(r => {
    const names = r.exercises.map(x => x.name).join(', ');
    return `
    <article class="rounded-2xl bg-surface border border-line p-4">
      <h2 class="text-xl font-bold truncate">${esc(r.name)}</h2>
      <p class="mt-0.5 text-sm text-mute">${plural(r.exercises.length, 'ejercicio', 'ejercicios')}</p>
      ${names ? `<p class="mt-2 text-sm text-mute/80 line-clamp-2">${esc(names)}</p>` : ''}
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button data-action="routine-open" data-id="${esc(r.id)}" class="press h-14 rounded-xl bg-raised font-semibold">Editar</button>
        <button data-action="train-start" data-id="${esc(r.id)}" class="press h-14 rounded-xl border-2 border-plate text-plate font-bold">Entrenar</button>
      </div>
    </article>`;
  }).join('');

  return `
    <button data-action="routine-new" class="press w-full h-16 rounded-2xl bg-plate text-ink font-bold text-xl flex items-center justify-center gap-2">${icon('plus')} Nueva rutina</button>
    ${state.routines.length
      ? `<div class="mt-4 space-y-3">${cards}</div>`
      : emptyBlock('Todavía no tienes rutinas', 'Crea la primera, por ejemplo «Pecho y hombro», y añade sus ejercicios.')}`;
}

function viewRoutineDetail(r) {
  const rows = r.exercises.map(x => `

function chart(pts) {
  const W = 320, H = 150, L = 38, R = 12, T = 14, B = 26;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const iw = W - L - R, ih = H - T - B;
  const X = i => L + i * iw / (pts.length - 1);
  const Y = v => T + ih * (1 - (v - lo) / (hi - lo));
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="#f2c230"/>`).join('');
  const sd = iso => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  const txt = 'fill="#9d9da6" font-size="11"';
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Evolución por sesión">
    <line x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke="#303035"/>
    <line x1="${L}" y1="${T + ih}" x2="${W - R}" y2="${T + ih}" stroke="#303035"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end" ${txt}>${fmt(hi)}</text>
    <text x="${L - 6}" y="${T + ih + 4}" text-anchor="end" ${txt}>${fmt(lo)}</text>
    <text x="${L}" y="${H - 6}" ${txt}>${sd(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" ${txt}>${sd(pts[pts.length - 1].d)}</text>
    <path d="${path}" fill="none" stroke="#f2c230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

/* =========================================================
   Temporizador individual por ejercicio: trabajo + descanso entre series
   (se actualiza en sitio, sin re-render, para no molestar al escribir)
   ========================================================= */
const exTimer = { idx: null, phase: 'work', serie: 1, total: 0, remaining: 0, running: false, finished: false, endAt: 0, interval: null };
const fmtClock = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
const timerRemainingFor = i => {
  const e = state.draft && state.draft.entries[i];
  if (!e) return 0;
  return exTimer.idx === i ? exTimer.remaining : e.workSec;
};
const timerActive = i => exTimer.idx === i && !exTimer.finished && (exTimer.running || exTimer.remaining > 0);
const timerBtnLabel = i => exTimer.idx === i && exTimer.running ? 'Pausar' : (timerActive(i) ? 'Reanudar' : 'Iniciar');
const timerPhaseText = i => exTimer.idx !== i ? 'PREPARADO' : exTimer.finished ? 'TERMINADO' : exTimer.phase === 'work' ? 'TRABAJO' : 'DESCANSO';
const timerSerieText = i => {
  const e = state.draft && state.draft.entries[i]; const n = e ? e.sets.length : 0;
  return timerActive(i) ? `Serie ${Math.min(exTimer.serie, n)} de ${n}` : plural(n, 'serie', 'series');
};
const timerBadgeText = i => `${exTimer.phase === 'work' ? 'Trabajo' : 'Descanso'} ${fmtClock(timerRemainingFor(i))}`;
const timerBadgeFor = (i, pos = 'absolute top-2 right-2') =>
  `<span data-timer-badge="${i}" class="num ${pos} px-3 py-1 rounded-full bg-black/70 text-plate font-bold text-sm ${timerActive(i) ? '' : 'hidden'}">${timerBadgeText(i)}</span>`;

function paintTimer() {
  const all = sel => document.querySelectorAll(sel);
  all('[data-timer-display]').forEach(el => { el.textContent = fmtClock(timerRemainingFor(+el.dataset.timerDisplay)); });
  all('[data-timer-phase]').forEach(el => {
    const i = +el.dataset.timerPhase;
    el.textContent = timerPhaseText(i);
    el.className = 'text-sm font-bold tracking-wide ' + (timerActive(i) ? (exTimer.phase === 'work' ? 'text-plate' : 'text-chalk') : 'text-mute');
  });
  all('[data-timer-serie]').forEach(el => { el.textContent = timerSerieText(+el.dataset.timerSerie); });
  all('[data-timer-bar]').forEach(el => {
    const i = +el.dataset.timerBar;
    const pct = exTimer.idx === i && exTimer.total ? (exTimer.finished ? 100 : Math.round(100 * (exTimer.total - exTimer.remaining) / exTimer.total)) : 0;
    el.style.width = pct + '%';
    el.className = 'h-full rounded-full ' + (exTimer.phase === 'rest' && timerActive(i) ? 'bg-chalk' : 'bg-plate');
  });
  all('[data-timer-badge]').forEach(el => {
    const i = +el.dataset.timerBadge;
    el.textContent = timerBadgeText(i);
    el.classList.toggle('hidden', !timerActive(i));
  });
  all('[data-timer-btn]').forEach(el => { el.textContent = timerBtnLabel(+el.dataset.timerBtn); });
}
function stopTimerInterval() { if (exTimer.interval) { clearInterval(exTimer.interval); exTimer.interval = null; } }
function runTimerLoop() { stopTimerInterval(); exTimer.interval = setInterval(tickTimer, 250); }
function resetTimer() {
  stopTimerInterval();
  Object.assign(exTimer, { idx: null, phase: 'work', serie: 1, total: 0, remaining: 0, running: false, finished: false, endAt: 0 });
}
function syncTimerCfg(e) {
  document.querySelectorAll('#focusBody [data-timer-cfg]').forEach(el => {
    const k = el.dataset.timerCfg;
    e[k] = clampSec(el.value, k === 'workSec' ? 40 : 90);
    el.value = e[k];
  });
  save();
}
// Trabajo de la serie N -> descanso -> trabajo de la serie N+1 ... hasta la última serie
function nextPhaseOf(e) {
  if (exTimer.phase === 'work') return exTimer.serie >= e.sets.length ? null : { phase: 'rest', serie: exTimer.serie, dur: e.restSec };
  return { phase: 'work', serie: exTimer.serie + 1, dur: e.workSec };
}
function tickTimer() {
  if (!exTimer.running) return;
  const e = state.draft && state.draft.entries[exTimer.idx];
  if (!e) { resetTimer(); paintTimer(); return; }
  const now = Date.now();
  let changed = false, guard = 0;
  while (exTimer.running && exTimer.endAt <= now && guard++ < 60) {
    changed = true;
    const nx = nextPhaseOf(e);
    if (!nx) { stopTimerInterval(); exTimer.running = false; exTimer.finished = true; exTimer.remaining = 0; break; }
    exTimer.phase = nx.phase; exTimer.serie = nx.serie; exTimer.total = nx.dur; exTimer.endAt += nx.dur * 1000;
  }
  if (exTimer.running) exTimer.remaining = Math.max(0, Math.ceil((exTimer.endAt - now) / 1000));
  if (changed) {
    playSound(); vibrate(exTimer.finished ? [300, 120, 300] : 250);
    if (exTimer.finished) toast(`Temporizador terminado: ${e.exerciseName}`);
  }
  paintTimer();
}

/* =========================================================

const setDone = st => parseNum(st.reps) > 0;
const progressOf = e => ({ done: e.sets.filter(setDone).length, total: e.sets.length });
const progressText = e => { const p = progressOf(e); return p.total ? `${p.done}/${p.total} series` : 'Sin series'; };
const progressLabel = e => { const p = progressOf(e); return `${p.done} de ${p.total} series completadas`; };
const progressCls = e => 'num absolute top-2 left-2 px-3 py-1 rounded-full font-bold text-xs ' + (e.completed ? 'bg-plate text-ink' : 'bg-black/70 text-chalk');

function cardHtml(e, idx) {
  const last = lastSets(e.exerciseName);
  const lastTxt = last ? `Última vez: ${last.sets.map(fmtSet).join(', ')}` : 'Primera vez con este ejercicio';
  return `
    <button data-action="exercise-select" data-card="${idx}" data-i="${idx}" class="press shrink-0 card-w h-full mx-1.5 flex flex-col rounded-2xl bg-surface border-2 ${e.completed ? 'border-plate' : 'border-line'} overflow-hidden snap-center text-left">
      <div class="relative flex-1 min-h-0 ${e.gif ? 'bg-black/30' : 'bg-raised'} overflow-hidden">
        ${e.gif ? `<img src="${esc(e.gif)}" alt="${esc(e.exerciseName)}" class="absolute inset-0 w-full h-full object-cover">` : `<div class="absolute inset-0 flex items-center justify-center"><p class="text-sm text-mute">Sin imagen</p></div>`}
        <span data-progress aria-label="${esc(progressLabel(e))}" class="${progressCls(e)}">${progressText(e)}</span>
        ${timerBadgeFor(idx)}
      </div>
      <div class="shrink-0 p-4">
        <h3 class="font-bold text-xl truncate">${esc(e.exerciseName)}</h3>
        <p class="text-sm text-mute truncate mt-0.5">${esc(lastTxt)}</p>
      </div>
    </button>`;
}

// Actualiza la tarjeta en sitio (sin reconstruir el carrusel ni reiniciar el GIF)
function paintCard(i) {
  const e = state.draft && state.draft.entries[i];
  const card = document.querySelector(`[data-card="${i}"]`);
  if (!e || !card) return;
  const b = card.querySelector('[data-progress]');
  if (b) { b.textContent = progressText(e); b.className = progressCls(e); b.setAttribute('aria-label', progressLabel(e)); }
  card.classList.toggle('border-plate', !!e.completed);
  card.classList.toggle('border-line', !e.completed);
}

}

function renderFocusSheet() {
  const i = ui.selectedExerciseIdx, d = state.draft;
  const e = d && i !== null ? d.entries[i] : null;
  if (!e) { closeFocus(); return; }
  const body = $('#focusBody'), top = body.scrollTop;
  $('#focusHead').innerHTML = focusHeadHtml(e, i);
  body.innerHTML = focusBodyHtml(e, i);
  body.scrollTop = top;
  paintTimer();
}

// Al abrir Notas/Temporizador: recorre el panel hasta el bloque y lo resalta un instante
function revealBlock(name) {
  requestAnimationFrame(() => {
    const body = $('#focusBody'), el = body && body.querySelector(`[data-block="${name}"]`);
    if (!el) return;
    const delta = el.getBoundingClientRect().top - body.getBoundingClientRect().top;
    body.scrollTo({ top: Math.max(0, body.scrollTop + delta - 12), behavior: 'smooth' });

// Actualiza la tarjeta y, si está abierto, el panel; nunca reconstruye el carrusel
function refresh(i) {
  paintCard(i);

}

// Entrenar: todo cabe en pantalla. Tarjeta = 60 % del alto (o menos si no cabe), centrada.
function fitTrain(fresh) {
  const wrap = document.getElementById('trainWrap');
  const root = document.documentElement;
  root.classList.toggle('train-fit', !!wrap);
  if (!wrap || ui.selectedExerciseIdx !== null) return;      // con el panel abierto no se toca el fondo
  const vv = window.visualViewport, vh = Math.round(vv ? vv.height : innerHeight);
  const nav = document.querySelector('nav'), navH = nav ? nav.offsetHeight : 64;
  root.style.setProperty('--train-pad', (navH + 12) + 'px');
  const car0 = $('#trainZone') && $('#trainZone').firstElementChild;
  let prevMid = 0;
  if (!fresh && car0) {
    const r0 = car0.getBoundingClientRect(); prevMid = r0.left + r0.width / 2;
    [...car0.children].forEach(c => { const r = c.getBoundingClientRect(); c._mid = r.left + r.width / 2; });
  }
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  wrap.style.height = Math.max(vh - top - navH - 12, 380) + 'px';
  const zone = $('#trainZone'), car = zone && zone.firstElementChild; if (!car) return;
  const h = Math.max(160, Math.min(Math.round(vh * 0.6), zone.clientHeight));
  car.style.height = h + 'px';
  car.style.setProperty('--cw', Math.round(Math.min(car.clientWidth * 0.8, h * 0.78)) + 'px');
  // Mantiene centrada la tarjeta que se estaba viendo (o la última abierta si se acaba de reconstruir)
  const cards = [...car.children];
  if (!cards.length) return;
  let cur = Math.min(ui.carouselIdx, cards.length - 1);
  if (!fresh) {
    const mid = prevMid; let best = Infinity;
    cards.forEach((c, i) => { const d = Math.abs(c._mid - mid); if (d < best) { best = d; cur = i; } });
  }
  cards[cur].scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
}
const onViewportChange = () => { fitFocus(); fitTrain(false); };

function fitFocus() {
  const root = $('#focusSheet');
  if (!root || root.classList.contains('hidden')) return;
  const vv = window.visualViewport;

function exportData() {
  state.meta.lastExport = new Date().toISOString();
  save();
  const payload = {
    app: 'gym-log', version: 1, exportedAt: state.meta.lastExport,
    encoding: 'utf-8',
    data: { routines: state.routines, workouts: state.workouts }
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([new TextEncoder().encode(jsonStr)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-log-${ymd(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Datos exportados');

async function importFile(file) {
  let incoming;
  try {
    const text = await file.text();
    incoming = normalize(JSON.parse(text));
  } catch (e) {
    toast('El archivo no es una copia válida de Gym Log', 'error');

  const ok = await confirmDialog({

/* =========================================================
   Temporizador: sonido y vibración
   ========================================================= */
function vibrate(ms = 200) {
  try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
}

let audioCtx;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function playSound() {
  try {
    unlockAudio();
    const ctx = audioCtx;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.3);
  } catch (e) {}
}

   Eventos globales
   ========================================================= */
document.addEventListener('click', e => {
  const menu = $('#exMenu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('[data-menu]')) menu.classList.add('hidden');

/* ---- Reordenar ejercicios: mantener pulsado o arrastrar desde el asa izquierda ---- */
const drag = { active: false, pending: null, timer: null, row: null, list: null, grab: 0, y: 0, raf: 0, suppressUntil: 0 };

function applyExerciseOrder(ids) {
  const r = currentRoutine(); if (!r) return;
  const byId = new Map(r.exercises.map(x => [x.id, x]));
  const next = ids.map(id => byId.get(id)).filter(Boolean);
  if (next.length === r.exercises.length && ids.some((id, i) => id !== r.exercises[i].id)) { r.exercises = next; save(); }
  render();
}
function dragCancelPending() { clearTimeout(drag.timer); drag.timer = null; drag.pending = null; }
function dragBegin() {
  const pd = drag.pending; dragCancelPending();
  if (!pd || !pd.row.isConnected) return;
  drag.active = true; drag.row = pd.row; drag.list = pd.row.parentElement; drag.y = pd.y;
  drag.grab = pd.y - pd.row.getBoundingClientRect().top;
  pd.row.classList.add('ring-2', 'ring-plate', 'shadow-xl', 'z-10', 'relative', 'bg-raised');
  pd.row.style.transition = 'none';
  document.documentElement.classList.add('dragging');
  try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
  dragLoop();
}
function dragUpdate() {
  const row = drag.row; if (!row) return;
  row.style.transform = '';
  const h = row.offsetHeight, want = drag.y - drag.grab, center = want + h / 2;
  let prev = row.previousElementSibling, next = row.nextElementSibling, guard = 0;
  while (prev && guard++ < 50 && center < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { drag.list.insertBefore(row, prev); prev = row.previousElementSibling; }
  next = row.nextElementSibling;
  while (next && guard++ < 100 && center > next.getBoundingClientRect().top + next.offsetHeight / 2) { drag.list.insertBefore(next, row); next = row.nextElementSibling; }
  row.style.transform = `translateY(${want - row.getBoundingClientRect().top}px)`;
}
function dragLoop() {
  if (!drag.active) return;
  const top = 150, bottom = innerHeight - 140;
  if (drag.y < top) window.scrollBy(0, -Math.min(18, (top - drag.y) / 5));
  else if (drag.y > bottom) window.scrollBy(0, Math.min(18, (drag.y - bottom) / 5));
  dragUpdate();
  drag.raf = requestAnimationFrame(dragLoop);
}
function dragEnd() {
  if (!drag.active) return;
  cancelAnimationFrame(drag.raf);
  drag.active = false; drag.suppressUntil = Date.now() + 400;
  document.documentElement.classList.remove('dragging');
  const ids = [...drag.list.children].map(li => li.dataset.ex).filter(Boolean);
  drag.row = null;
  applyExerciseOrder(ids);
}
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest && ev.target.closest('[data-ex]');
  if (!row || drag.active || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  const onHandle = !!ev.target.closest('[data-drag-handle]');
  if (!onHandle && ev.target.closest('button, a, input, textarea')) return;
  drag.pending = { row, x: ev.clientX, y: ev.clientY };
  if (onHandle) dragBegin();
  else drag.timer = setTimeout(dragBegin, 380);
});
document.addEventListener('pointermove', ev => {
  if (drag.active) { drag.y = ev.clientY; return; }
  const pd = drag.pending;
  if (pd && Math.hypot(ev.clientX - pd.x, ev.clientY - pd.y) > 10) dragCancelPending();   // era un scroll
  else if (pd) { pd.x = ev.clientX; pd.y = ev.clientY; }
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { dragCancelPending(); dragEnd(); }));
document.addEventListener('touchmove', ev => { if (drag.active) ev.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', ev => { if (ev.target.closest && ev.target.closest('[data-ex]')) ev.preventDefault(); });
document.addEventListener('click', ev => { if (Date.now() < drag.suppressUntil) { ev.stopPropagation(); ev.preventDefault(); } }, true);
// Teclado / lector de pantalla: flechas sobre el asa
document.addEventListener('keydown', ev => {
  const h = ev.target.closest && ev.target.closest('[data-drag-handle]');
  if (!h || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
  ev.preventDefault();
  const li = h.closest('[data-ex]'), r = currentRoutine(); if (!li || !r) return;
  const ids = r.exercises.map(x => x.id), i = ids.indexOf(li.dataset.ex), j = i + (ev.key === 'ArrowUp' ? -1 : 1);
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  applyExerciseOrder(ids);
  const again = document.querySelector(`[data-ex="${CSS.escape(li.dataset.ex)}"] [data-drag-handle]`); if (again) again.focus();
});

/* ---- Contador de tiempo del entrenamiento (calculado desde startedAt: sobrevive a recargas) ---- */
const paintElapsed = () => document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = fmtElapsed(elapsedSec()); });
setInterval(() => { if (state.draft) paintElapsed(); }, 500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) paintElapsed(); });

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onViewportChange);
  window.visualViewport.addEventListener('scroll', fitFocus);
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', () => setTimeout(onViewportChange, 150));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.selectedExerciseIdx !== null) closeFocus(); });

// Deslizar hacia abajo desde el asa cierra el panel
(() => {
  const grab = $('#focusGrab'), panel = $('#focusPanel');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', ev => { y0 = ev.clientY; dy = 0; panel.style.transition = 'none'; grab.setPointerCapture(ev.pointerId); });
  grab.addEventListener('pointermove', ev => {
    if (y0 === null) return;
    dy = Math.max(0, ev.clientY - y0);
    panel.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    const far = dy > 90; y0 = null; dy = 0;
    panel.style.transition = '';
    if (far) closeFocus(); else panel.style.transform = '';
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
})();

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-field]') && state.draft) {
    if (el.dataset.field === 'notes') {
      const entry = state.draft.entries[+el.dataset.i];
      if (!entry) return;
      entry.notes = el.value.slice(0, 500);
      save();
    } else {
      const s = state.draft.entries[+el.dataset.i]?.sets[+el.dataset.j];
      if (!s) return;
      let v = el.value;
      v = el.dataset.field === 'reps' ? v.replace(/\D/g, '') : v.replace(/[^\d.,]/g, '');
      if (v !== el.value) el.value = v;
      s[el.dataset.field] = v;
      save(); paintCard(+el.dataset.i);
    }
  } else if (el.dataset.timerCfg) {
    el.value = el.value.replace(/\D/g, '').slice(0, 4);
  } else if (el.id === 'histSearch') {
    ui.filter = el.value;
    render();
  }
});

document.addEventListener('change', e => {
  const cfg = e.target.dataset && e.target.dataset.timerCfg;
  if (cfg && state.draft) {
    const en = state.draft.entries[+e.target.dataset.i];
    if (en) { en[cfg] = clampSec(e.target.value, cfg === 'workSec' ? 40 : 90); e.target.value = en[cfg]; save(); paintTimer(); }
  }
  if (e.target.id === 'importFile') {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importFile(f);
  }
});

/* =========================================================
   Arranque
   ========================================================= */
render();
})();
</script>
</body>
</html>
